services:

  backend:
    build: ./backend
    container_name: ecommerce_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: ecommerce_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env

  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ai-service:
    build: ./ai-service
    container_name: ecommerce_ai_service
    ports:
      - "8002:8002"
    volumes:
      - ./ai-service:/app
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    env_file:
      - ./ai-service/.env
    depends_on:
      - mongodb

volumes:
  mongodb_data: